*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
body{margin:0;background:var(--bg);color:var(--body);font:16px/1.55 'Libre Franklin',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.wrap{max-width:76rem;margin:0 auto;padding:0 1.25rem}
h1,h2,h3{font-family:'Spectral',Georgia,'Times New Roman',serif;color:var(--ink);line-height:1.1;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.4rem)}
h2{font-size:clamp(1.5rem,3vw,2rem)}
h3{font-size:1.25rem}
p{margin:0 0 .9rem;max-width:44rem}
a{color:var(--teal)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-top:.45rem;padding-bottom:.45rem}
.brand{font-family:'Spectral',Georgia,serif;font-weight:700;color:var(--ink);font-size:1.15rem}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{background:transparent;color:var(--ink);border:0;padding:.4rem .8rem;min-height:40px;cursor:pointer;font-weight:600;font-size:.92rem}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
header{padding:2.25rem 0 1.5rem;border-bottom:1px solid var(--rule)}
.lede{font-size:1.15rem;margin-top:.8rem}
.stats{display:flex;flex-wrap:wrap;gap:2.5rem;margin-top:1.5rem}
.stat b{display:block;font-family:'Spectral',Georgia,serif;font-size:2rem;color:var(--ink);line-height:1}
.stat span{font-size:.9rem;color:var(--muted)}
main{padding:2rem 0 3rem}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(18rem,1fr);gap:2rem;align-items:start}
@media (max-width:56rem){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);padding:1.25rem 1.4rem;border-radius:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.toolbar label{font-weight:600;color:var(--ink);font-size:.95rem}
select,textarea,input[type=text],input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:.55rem .7rem;min-height:44px}
.map svg{width:100%;height:auto;display:block}
.map path{stroke:var(--bg);stroke-width:1.3;cursor:pointer;transition:fill .35s ease}
.map path:hover{stroke:var(--ink);stroke-width:2}
.map path.sel{stroke:var(--ink);stroke-width:3}
.map path:focus{outline:none}
.map path:focus-visible{stroke:var(--focus);stroke-width:3}
.map text{font-size:10.5px;font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;font-size:.85rem;color:var(--muted);margin-top:.6rem}
.legend i{display:inline-block;width:1.4rem;height:.8rem;margin-right:.35rem;vertical-align:middle;border-radius:2px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:1.8rem minmax(0,1fr) 3rem;gap:.6rem;align-items:center;padding:.15rem 0}
.rank button{all:unset;cursor:pointer;display:block;padding:.35rem 0;min-height:44px;box-sizing:border-box}
.rank button:focus-visible{outline:3px solid var(--focus)}
.rank .n{font-weight:700;color:var(--muted);text-align:right}
.rank .nm{font-weight:600;color:var(--ink)}
.rank .tp{font-size:.8rem;color:var(--muted)}
.rank .bar{height:.4rem;background:var(--rule);border-radius:2px;margin-top:.25rem}
.rank .bar i{display:block;height:100%;border-radius:2px;background:var(--c4);transition:width .4s ease}
.rank .v{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.block{margin-top:2rem}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem 1.5rem;margin-top:1rem}
.w label{display:flex;justify-content:space-between;font-weight:600;color:var(--ink);font-size:.95rem}
.w small{display:block;color:var(--muted);font-size:.82rem;margin-top:.15rem}
input[type=range]{width:100%;accent-color:var(--c4);min-height:44px}
.btn{background:var(--ink);color:var(--onink);border:1px solid var(--ink);border-radius:4px;padding:.65rem 1.1rem;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:.6rem;flex-wrap:wrap}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;align-items:baseline}
.tag{display:inline-block;font-size:.85rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;color:var(--onink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem;margin:1.25rem 0}
.kpi b{display:block;font-family:'Spectral',Georgia,serif;font-size:1.7rem;color:var(--ink);line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.strand{display:flex;height:1.6rem;border-radius:3px;overflow:hidden;margin:.5rem 0}
.strand i{display:block;height:100%}
.skey{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.85rem;color:var(--muted)}
.skey i{display:inline-block;width:.8rem;height:.8rem;margin-right:.3rem;vertical-align:-1px;border-radius:2px}
.pov{display:grid;grid-template-columns:4.5rem 1fr 3rem;gap:.5rem;align-items:center;font-size:.9rem;margin:.3rem 0}
.pov .t{height:.9rem;background:var(--rule);border-radius:2px}
.pov .t i{display:block;height:100%;border-radius:2px}
.opts{margin:.5rem 0 0;padding-left:1.2rem}
.opts li{margin-bottom:.5rem;max-width:44rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:2rem}
.muted{color:var(--muted);font-size:.9rem}
.ai-out{background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:1rem 1.2rem;white-space:pre-wrap;color:var(--ink);margin-top:.8rem}
.ai-out.err{color:var(--c4)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.chip{background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:.45rem .9rem;min-height:44px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.askrow{display:flex;gap:.5rem;flex-wrap:wrap}
.askrow input{flex:1 1 16rem}
.thread{display:flex;flex-direction:column;gap:.4rem}
.q{font-weight:700;color:var(--ink);margin-top:.8rem}
.method{border-top:1px solid var(--rule);padding:2.5rem 0}
.method h3{margin:1.5rem 0 .5rem;font-size:1.15rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--rule)}
th{color:var(--ink)}
.scroll{overflow-x:auto}
footer{border-top:1px solid var(--rule);padding:1.5rem 0 2.5rem;font-size:.88rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.rank .lk{display:block;font-size:.78rem;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem 1.5rem;margin:1rem 0}
.frow label{display:block;font-weight:600;color:var(--ink);font-size:.92rem;margin-bottom:.3rem}
.frow input,.frow select{width:100%}
.note{background:var(--bg);border-left:4px solid var(--c3);padding:.7rem 1rem;margin:.8rem 0;font-size:.92rem;color:var(--ink)}
.note.demo{border-left-color:var(--c4)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
td.up{color:var(--teal);font-weight:600} td.down{color:var(--c4);font-weight:600}
#report{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body>*:not(#report){display:none!important}
  #report{display:block;color:#000;font-size:10.5pt;line-height:1.45}
  #report h1{font-size:20pt;margin:0 0 2pt} #report h2{font-size:12pt;margin:10pt 0 3pt}
  #report .rp-sub{color:#444;margin:0 0 8pt} #report .rp-kpis{display:flex;gap:16pt;margin:6pt 0 4pt}
  #report .rp-kpis b{display:block;font-size:15pt;font-family:Georgia,serif} #report .rp-kpis span{font-size:8.5pt;color:#444}

  #report .rp-body{white-space:pre-wrap} #report .rp-foot{border-top:1px solid #999;margin-top:10pt;padding-top:4pt;font-size:8pt;color:#444}
}

<body>
<div class="topbar"><div class="wrap">

</div></div>

<header><div class="wrap">

</div></header>

<main class="wrap">

  </div>

  <section class="block card" aria-labelledby="wH">

      <div class="btns"><button class="btn ghost" id="reset" type="button" data-i="reset"></button><button class="btn" id="dl" type="button" data-i="dl"></button></div></div>
    <p style="margin:0" data-i="wP"></p>
    <div class="wgrid" id="wgrid"></div>

  </section>

  <section class="block card" id="detail" aria-live="polite"></section>

  <section class="block card" id="alSec" aria-labelledby="alH">
    <div class="toolbar"><h2 id="alH" data-i="alH"></h2><button class="btn ghost" type="button" id="alDl" data-i="alDl"></button></div>
    <p data-i="alP"></p>
    <div class="frow">
      <div><label for="alPeople" data-i="alPeople"></label><input type="number" id="alPeople" min="0" step="1000" value="50000"></div>
      <div><label for="alCost" data-i="alCost"></label><input type="number" id="alCost" min="0" step="1000" placeholder="0"></div>
      <div><label for="alMethod" data-i="alMethod"></label><select id="alMethod"><option value="top"></option><option value="all"></option></select></div>
      <div id="alNbox"><label for="alN" id="alNl"></label><input type="range" id="alN" min="1" max="30" value="10"></div>
    </div>
    <p id="alSum" style="font-weight:600;color:var(--ink)"></p>
    <div class="scroll"><table id="alTable"></table></div>
    <p class="muted" style="margin-top:.8rem" data-i="alNote"></p>
  </section>

  <section class="block card" id="aiSec" aria-labelledby="aiH">
    <h2 id="aiH" data-i="aiH"></h2>
    <p style="margin-top:.5rem" data-i="aiP"></p>
    <div class="chips" id="chips"></div>
    <form class="askrow" id="askForm">
      <label for="askIn" class="sr" data-i="askL"></label>
      <input id="askIn" type="text" maxlength="500" autocomplete="off">
      <button class="btn" type="submit" id="askBtn" data-i="ask"></button>
      <button class="btn ghost" type="button" id="stopBtn" hidden data-i="stop"></button>
    </form>
    <div class="thread" id="thread" aria-live="polite"></div>
    <p class="muted" style="margin-top:1rem" id="aiNote" data-i="aiDisc"></p>
  </section>
  <section class="block card" id="cmpSec" aria-labelledby="cmpH">
    <h2 id="cmpH" data-i="cmpH"></h2>
    <p style="margin-top:.5rem" data-i="cmpP"></p>
    <div class="btns">
      <button class="btn ghost" type="button" id="cmpTpl" data-i="cmpTpl"></button>
      <label class="btn filebtn"><span data-i="cmpUp"></span><input type="file" id="cmpFile" accept=".csv,text/csv"></label>
      <button class="btn ghost" type="button" id="cmpDemo" data-i="cmpDemo"></button>
    </div>
    <div id="cmpOut" aria-live="polite"></div>
  </section>
</main>

<section class="method"><div class="wrap">
  <h2 data-i="mH"></h2>
  <div class="cols">
    <div>
      <h3 data-i="m1h"></h3><p data-i="m1"></p>
      <h3 data-i="m2h"></h3><p data-i="m2"></p>
      <h3 data-i="m3h"></h3><p data-i="m3"></p>
    </div>
    <div>
      <h3 data-i="m4h"></h3><p data-i="m4"></p>
      <h3 data-i="m5h"></h3><p data-i="m5"></p>
      <h3 data-i="m6h"></h3><p data-i="m6"></p>
      <h3 data-i="m7h"></h3><p data-i="m7"></p>
    </div>
  </div>
  <h3 data-i="tableH"></h3>
  <div class="scroll"><table id="table"></table></div>
</div></section>

<footer><div class="wrap" data-i="foot"></div></footer>
<div id="report" aria-hidden="true"></div>

  m7:'District figures are survey estimates. The tool re-draws every district\'s poverty rates and finance shares 1,000 times within their sampling error (an effective sample of 250 per district, allowing for cluster sampling of about 400 to 500 households or adults) and recomputes the ranking each time with your weights. The "likely" range covers 90% of these simulations. Replace this assumption with NISR\'s published standard errors when available (columns poverty_2024_se and finscope_n in the raw files).',

  mH:'How it works',
  m1h:'The priority index', m1:'Five indicators are rescaled from 0 (lowest district) to 1 (highest) and combined with the weights above: poverty rate; number of poor people (poverty rate times 2022 population); share of adults not formally served (informal only or excluded); share of adults without a bank account; and slow poverty reduction since 2017.',

  m5h:'Why no district-level prediction model', m5:'We tested three models predicting district poverty from finance and census indicators. With only 30 districts, ridge regression and random forests did no better than the national average in leave-one-out tests; gradient boosting did somewhat better (R² 0.25), but that is too fragile to rank districts on. Prediction belongs at household level, so the household model waits for EICV7 microdata.',
  m6h:'Sources', m6:'NISR, EICV7 Poverty Profile 2023/24, Annex B. Access to Finance Rwanda and NISR, FinScope Rwanda 2024, Figure 13. NISR, Fifth Population and Housing Census 2022.',

  m7:'Imibare y\'uturere ni igereranya ry\'ubushakashatsi. Igikoresho cyongera gutoranya inshuro 1 000 ibipimo by\'ubukene n\'ibya serivisi z\'imari bya buri karere mu rugero rw\'amakosa y\'icyitegererezo (icyitegererezo gifatika cya 250 kuri buri karere, hitawe ku buryo ingo cyangwa abakuru 400 kugeza 500 batoranywa mu matsinda), kigasubiramo urutonde buri nshuro hakurikijwe uburemere bwawe. Imyanya "ishoboka" ihuriza 90% by\'iryo geragezwa. Simbuza iki gitekerezo amakosa asanzwe yatangajwe na NISR igihe ahari (inkingi poverty_2024_se na finscope_n mu madosiye y\'ibanze).',

  m5h:"Impamvu nta moderi yo guteganya ku rwego rw'akarere", m5:"Twagerageje moderi eshatu zo guteganya ubukene bw'akarere hashingiwe ku mibare y'imari n'ibarura. Ku turere 30 gusa, ridge na random forest ntizarushije impuzandengo y'igihugu; gradient boosting yarushijeho gato (R² 0,25), ariko ntibihagije ngo ishingirweho mu gutondeka uturere. Iteganya rikwiye gukorwa ku rwego rw'urugo, ari yo mpamvu moderi y'ingo itegereje amakuru y'ibanze ya EICV7.",

// ---------- Coverage allocator ----------
var lastAlloc=null;
function drawAlloc(){if(!window.NtwTools)return;var people=+$('alPeople').value||0,cost=+$('alCost').value||0,method=$('alMethod').value,n=+$('alN').value;
  $('alNbox').hidden=method!=='top';$('alNl').textContent=t('alN',{n:n});
  var o=$('alMethod').options;o[0].textContent=t('alTop');o[1].textContent=t('alAll');
  var a=NtwTools.allocate(rows,{people:people,method:method,topN:n,cost:cost||null});lastAlloc=a;
  $('alSum').textContent=t('alSum',{placed:fmt(a.placed),d:a.lines.length,cost:a.cost?t('alCostTxt',{c:fmt(a.cost)}):''})+(a.unplaced>0?' '+t('alUnplaced',{n:fmt(a.unplaced)}):'');
  var tb=$('alTable');tb.textContent='';var th=t('alTh').slice(0,cost?5:4),tr=el('tr');th.forEach(function(x){var c=el('th',null,x);c.scope='col';tr.appendChild(c);});var hd=el('thead');hd.appendChild(tr);tb.appendChild(hd);
  var bd=el('tbody');a.lines.forEach(function(l){var tr=el('tr');[l.district,l.rank,fmt(l.people),pc(Math.round(l.share*10)/10)].concat(cost?[fmt(l.people*cost)]:[]).forEach(function(v){tr.appendChild(el('td',null,v));});bd.appendChild(tr);});tb.appendChild(bd);}
['alPeople','alCost','alMethod','alN'].forEach(function(id){$(id).addEventListener('input',drawAlloc);});
$('alDl').addEventListener('click',function(){if(!lastAlloc)return;var lines=['district,priority_rank,people_reached,poor_people,share_of_poor_pct,cost_rwf'].concat(lastAlloc.lines.map(function(l){return [l.district,l.rank,l.people,l.poor,l.share.toFixed(1),$('alCost').value?l.people*(+$('alCost').value):''].join(',');}));
  lines.push('');lines.push('method,'+$('alMethod').value+($('alMethod').value==='top'?' '+$('alN').value:''));lines.push('weights,'+IND.map(function(i){return i.key+'='+W[i.key];}).join(';'));download('ntawusigara_allocation.csv',lines.join('\n'));});
function download(name,text){var blob=new Blob([text],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}

// ---------- One-page printable report ----------
function printReport(r){compute();computeRanges();var R=$('report');R.textContent='';var x=RANGES[r.district];
  R.appendChild(el('h1',null,r.district));
  R.appendChild(el('p','rp-sub',t('rpTitle')+' · '+t('prov')[r.province]+' · '+t('typ')[r.typology]+' · '+t('rankOf',{r:r.rank})+(x?' ('+t('likely',{lo:x.lo,hi:x.hi})+')':'')));
  var k=el('div','rp-kpis');[[pc(r.poverty_2024),t('povH')+' 2024'],[fmt(r.poor_people),t('k2')],[pc(r.banked),t('s1')],[pc(r.top5_robustness_pct),t('k4')]].forEach(function(v){var d=el('div');d.appendChild(el('b',null,v[0]));d.appendChild(el('span',null,v[1]));k.appendChild(d);});R.appendChild(k);
  R.appendChild(el('h2',null,t('finH')));var st=el('div','rp-strand');[['banked','#20232B'],['other_formal_only','#0E6E6E'],['informal_only','#D9A441'],['excluded','#A3402F']].forEach(function(p){var i=el('i');i.style.width=r[p[0]]+'%';i.style.background=p[1];st.appendChild(i);});R.appendChild(st);
  R.appendChild(el('p',null,[['banked','s1'],['other_formal_only','s2'],['informal_only','s3'],['excluded','s4']].map(function(p){return t(p[1])+' '+pc(r[p[0]]);}).join(' · ')));
  R.appendChild(el('h2',null,t('briefH')));R.appendChild(el('div','rp-body',window.NtwLocalAI?NtwLocalAI.brief(r.district,lang,aiCtx()):''));
  R.appendChild(el('p','rp-foot',t('rpGen',{d:new Date().toLocaleDateString(loc())})+' '+t('optNote')));
  window.print();}

// ---------- Compare a new survey round ----------
var lastCmp=null;
function showCompare(newRows,demo){compute();var c=NtwTools.compareRounds(rows,newRows,W),box=$('cmpOut');box.textContent='';lastCmp={rows:newRows,demo:demo};
  if(!c.matched){box.appendChild(el('div','note demo',t('cmpBad')));return;}
  if(demo)box.appendChild(el('div','note demo',t('cmpDemoNote')));
  var msg=[t('cmpSum',{m:c.matched})];msg.push(c.povFellSig.length?t('cmpFell',{l:c.povFellSig.join(', ')}):'');msg.push(c.povRoseSig.length?t('cmpRose',{l:c.povRoseSig.join(', ')}):'');
  if(!c.povFellSig.length&&!c.povRoseSig.length)msg.push(t('cmpNone'));if(c.bankRoseSig.length)msg.push(t('cmpBank',{l:c.bankRoseSig.join(', ')}));
  if(c.enteredTop5.length)msg.push(t('cmpIn',{l:c.enteredTop5.join(', ')}));if(c.leftTop5.length)msg.push(t('cmpOut',{l:c.leftTop5.join(', ')}));if(c.unknown.length)msg.push(t('cmpUnknown',{l:c.unknown.join(', ')}));
  box.appendChild(el('div','note',msg.filter(Boolean).join(' ')));
  var tb=el('table'),tr=el('tr');t('cmpTh').forEach(function(x){var th=el('th',null,x);th.scope='col';tr.appendChild(th);});var hd=el('thead');hd.appendChild(tr);tb.appendChild(hd);var bd=el('tbody');
  c.lines.filter(function(l){return l.inNew;}).sort(function(a,b){return a.newRank-b.newRank;}).forEach(function(l){var tr=el('tr');
    var cell=function(v,cls){var td=el('td',cls||null,v);tr.appendChild(td);};var sgn=function(d){return (d>0?'+':'')+dec(d);};
    cell(l.district);cell(pc(l.povNew));cell(sgn(l.povDelta)+(l.povSig?' *':''),l.povSig?(l.povDelta<0?'up':'down'):'');cell(pc(l.bankNew));cell(sgn(l.bankDelta)+(l.bankSig?' *':''),l.bankSig?(l.bankDelta>0?'up':'down'):'');
    cell(String(l.oldRank));var mv=l.oldRank-l.newRank;cell(l.newRank+(mv?' ('+(mv>0?'↑':'↓')+Math.abs(mv)+')':''));bd.appendChild(tr);});
  tb.appendChild(bd);var sc=el('div','scroll');sc.appendChild(tb);box.appendChild(sc);box.appendChild(el('p','muted',t('cmpStar')));}
$('cmpTpl').addEventListener('click',function(){download('ntawusigara_new_round_template.csv',NtwTools.templateCSV(rows));});
$('cmpDemo').addEventListener('click',function(){showCompare(NtwTools.demoRound(rows,Math.floor(Math.random()*1e6)),true);});
$('cmpFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){showCompare(NtwTools.parseCSV(rd.result),false);};rd.readAsText(f);e.target.value='';});

// ---------- Language ----------
function applyLang(){document.documentElement.lang=lang;document.title='Ntawusigara · '+t('mapH');
  document.querySelectorAll('[data-i]').forEach(function(n){n.textContent=t(n.getAttribute('data-i'));});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false');});
  svg.setAttribute('aria-label',t('mapAria'));
  var cb=$('colorBy');cb.textContent='';COLOR_KEYS.forEach(function(k){var o=el('option',null,t('cb')[k]);o.value=k;cb.appendChild(o);});cb.value=colorBy;
  var st=$('stats');st.textContent='';[[fmt(S.estimated_poor_people),t('st1')],[pc(27.4),t('st2')],[pc(92),t('st3')],[S.robust_top5.length,t('st4')]].forEach(function(s){var d=el('div','stat');d.appendChild(el('b',null,s[0]));d.appendChild(el('span',null,s[1]));st.appendChild(d);});
  update();drawAI();if(lastCmp)showCompare(lastCmp.rows,lastCmp.demo);}
function update(){drawWeights();var s=compute();computeRanges();drawRank(s);drawAlloc();drawMap();drawTable(s);drawDetail();$('robustNote').textContent=t('robust')+S.robust_top5.join(', ')+'.';}
document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;try{localStorage.setItem('ntw-lang',lang);}catch(e){}applyLang();});});
try{var sv=localStorage.getItem('ntw-lang');if(sv&&T[sv])lang=sv;else{var nl=(navigator.language||'').slice(0,2);if(T[nl])lang=nl;}}catch(e){}
applyLang();
})();
</script>
